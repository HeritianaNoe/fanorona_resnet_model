name: Build Fanorona AlphaZero TFLite

on:
  push:
    branches: [ main, master ]
    paths:
      - 'training/**'
      - '.github/workflows/build-fanorona-tflite.yml'
  workflow_dispatch:          # azo atao manual any amin'ny Actions tab
  schedule:
    - cron: '0 3 * * 0'       # isaky ny alahady 03:00 UTC (optional)

jobs:
  build-tflite:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install tensorflow==2.15.0 numpy

      - name: Build model + export TFLite
        run: |
          cd training          # na ovaina araka ny toerana misy ny script
          python fanorona_resnet_model.py

      - name: Upload TFLite artifact
        uses: actions/upload-artifact@v4
        with:
          name: fanorona-model-tflite
          path: |
            training/fanorona_model.tflite
            training/fanorona_resnet.keras
          retention-days: 30

      # Optional: commit ny .tflite mivantana any amin'ny repo (assets/)
      - name: Commit TFLite to assets (optional)
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          mkdir -p assets
          cp training/fanorona_model.tflite assets/fanorona_model.tflite
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/fanorona_model.tflite
          git diff --staged --quiet || git commit -m "chore: update fanorona_model.tflite [skip ci]"
          git push
